<svg xmlns="http://www.w3.org/2000/svg" width="760" height="90" viewBox="0 0 760 90">
  <defs>
    <pattern id="led" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#7DD3FC" fill-opacity="0.18"/>
    </pattern>
    <clipPath id="inner">
      <rect x="6" y="6" width="748" height="78" rx="8"/>
    </clipPath>
  </defs>

  <!-- board: white background with light blue frame -->
  <rect x="3" y="3" width="754" height="84" rx="12" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="6"/>

  <!-- LED dot texture + scrolling text, clipped to the inside of the frame -->
  <g clip-path="url(#inner)">
    <rect x="6" y="6" width="748" height="78" fill="url(#led)"/>
    <text y="54" font-family="Consolas, 'Courier New', Menlo, monospace" font-size="24" font-weight="700" fill="#3BB4E8" textLength="860" lengthAdjust="spacing" x="760">
      Welcome to Celeste protein-lab! Feel free to study with us!
      <animate attributeName="x" from="760" to="-880" dur="22s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
